name: Deploy Vite Portfolio

on: 
  push:
    branches: ["main"]

permissions: 
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependêcnias
        run: npm ci

      - name: Compilar Projeto com Vite (Build)
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload da pasta compilada (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar no Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
